title: 우아학과 - 전국 대학교·마이스터고 학과정보 찾기
description: >-
  전국 1,900여 개교, 9만 8천여 개 학과·전공 정보와 전국 마이스터고 위치정보를 한눈에 확인하세요.
  학위과정, 입학정원, 졸업자수, 관련직업까지 무료로 검색할 수 있습니다.
url: "https://wooamajor.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
